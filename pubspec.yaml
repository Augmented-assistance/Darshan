name: smritai
description: "Darshan - Cultural Heritage Identifier & Guide for Kathmandu Valley"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2
  image_picker: ^1.2.1
  share_plus: ^10.1.2
  flutter_local_notifications: ^18.0.1
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  wakelock_plus: ^1.2.8
  connectivity_plus: ^6.1.0
  intl: ^0.20.2
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  url_launcher: ^6.3.1
  flutter_map_cancellable_tile_provider: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png
  min_sdk_android: 24

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
